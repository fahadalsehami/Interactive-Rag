AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Amazon Kendra index with a web crawler data source for the NIMH Research Domain Criteria (RDoC) pages,
  used as the retrieval layer of the Interactive-Rag clinical analysis app.

Parameters:
  StackNamePrefix:
    Type: String
    Default: 'clinical-rag'
    AllowedPattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,40}$'
    Description: 'Prefix for resource names: letters, numbers and hyphens'

  KendraEdition:
    Type: String
    Default: 'DEVELOPER_EDITION'
    AllowedValues:
      - 'ENTERPRISE_EDITION'
      - 'DEVELOPER_EDITION'
    Description: 'DEVELOPER_EDITION is suitable for testing (Free Tier eligible)'

  Environment:
    Type: String
    Default: 'Development'
    AllowedValues:
      - 'Development'
      - 'Staging'
      - 'Production'
    Description: 'Deployment environment'

  DataSourceSyncSchedule:
    Type: String
    Default: 'cron(0 0 * * ? *)'
    Description: 'CRON expression for data source sync schedule'

Resources:
  KendraIndexRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: kendra.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: '/'
      Policies:
        - PolicyName: !Sub '${StackNamePrefix}-kendra-policy'
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': 'AWS/Kendra'
              - Effect: Allow
                Action:
                  - 'logs:DescribeLogGroups'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:DescribeLogStreams'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kendra/*'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  DocsKendraIndex:
    Type: 'AWS::Kendra::Index'
    Properties:
      Name: !Sub '${StackNamePrefix}-index'
      Edition: !Ref KendraEdition
      RoleArn: !GetAtt KendraIndexRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment

  KendraDSRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: kendra.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub '${StackNamePrefix}-ds-policy'
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'kendra:BatchPutDocument'
                  - 'kendra:BatchDeleteDocument'
                Resource: !Sub 'arn:aws:kendra:${AWS::Region}:${AWS::AccountId}:index/${DocsKendraIndex.Id}'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  RDoCDataSource:
    Type: 'AWS::Kendra::DataSource'
    Properties:
      DataSourceConfiguration:
        WebCrawlerConfiguration:
          Urls:
            SeedUrlConfiguration:
              SeedUrls:
                - 'https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc'
              WebCrawlerMode: 'HOST_ONLY'
          UrlInclusionPatterns:
            - '.*nimh\.nih\.gov/.*rdoc.*'
          CrawlDepth: 3
          MaxLinksPerPage: 100
      IndexId: !GetAtt DocsKendraIndex.Id
      Name: !Sub '${StackNamePrefix}-rdoc-datasource'
      RoleArn: !GetAtt KendraDSRole.Arn
      Type: 'WEBCRAWLER'
      Schedule: !Ref DataSourceSyncSchedule
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  KendraIndexID:
    Description: 'ID of the created Kendra Index'
    Value: !GetAtt DocsKendraIndex.Id
    Export:
      Name: !Sub '${AWS::StackName}-IndexId'
